# Prometheus scrapes operational metrics only (requests, errors, latency, model state).
# Statistical drift is analysed by the Evidently monitoring worker, not here.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: inference
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["inference:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
