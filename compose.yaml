# Local runtime for the churn ML lifecycle platform.
#
# Long-running services: PostgreSQL, MinIO, MLflow, inference API, monitoring worker,
# Prometheus, Grafana.
# One-shot setup containers: minio-init (buckets + scoped users), db-migrate (ops schema).
#
# Every host port is bound to 127.0.0.1 so nothing is reachable from other machines.
# Credentials come from `.env` (generated by `churnctl bootstrap`, never committed).
name: churn-platform

x-restart-policy: &restart-policy
  restart: unless-stopped

# Containers may never gain privileges after start (blocks setuid escalation).
x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

# Stronger hardening for the platform's own Python containers: non-root user (set in the
# image), read-only root filesystem, no Linux capabilities, writable /tmp only.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-platform-build: &platform-build
  context: .
  dockerfile: deploy/docker/platform.Dockerfile

services:
  postgres:
    <<: [*restart-policy, *no-new-privileges]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run churnctl bootstrap to create .env}
      # Read only by the first-start init script to create per-component roles.
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?}
      INFERENCE_DB_PASSWORD: ${INFERENCE_DB_PASSWORD:?}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Checks the ops database, not just the server: it only exists after init finished.
      test: ["CMD-SHELL", "pg_isready -U postgres -d churn_ops"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  minio:
    <<: [*restart-policy, *no-new-privileges]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER_REDIRECT: "false"
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (DVC on the host uses it)
      - "127.0.0.1:9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512m

  minio-init:
    <<: *no-new-privileges
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MLFLOW_S3_ACCESS_KEY: ${MLFLOW_S3_ACCESS_KEY:?}
      MLFLOW_S3_SECRET_KEY: ${MLFLOW_S3_SECRET_KEY:?}
      DVC_S3_ACCESS_KEY: ${DVC_S3_ACCESS_KEY:?}
      DVC_S3_SECRET_KEY: ${DVC_S3_SECRET_KEY:?}
    volumes:
      - ./deploy/minio/init.sh:/init/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mlflow:
    <<: [*restart-policy, *no-new-privileges]
    build:
      context: ./deploy/mlflow
    image: churn-platform/mlflow:3.16.1
    environment:
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
      MLFLOW_WORKERS: "2"
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?}@postgres:5432/mlflow
      # Artifact proxy: clients upload/download through MLflow, only MLflow talks to MinIO.
      MLFLOW_SERVE_ARTIFACTS: "true"
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      # Host-header allow list: the container name for internal callers, loopback for the host.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  db-migrate:
    <<: *hardened
    image: churn-platform/worker:1.0.0
    build:
      <<: *platform-build
      target: worker
      args:
        EXTRA: monitoring
    command: ["churnctl", "db", "migrate"]
    environment:
      OPS_DATABASE_URL: postgresql://churn_ops:${OPS_DB_PASSWORD:?}@postgres:5432/churn_ops
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  inference:
    <<: [*restart-policy, *hardened]
    image: churn-platform/inference:1.0.0
    build:
      <<: *platform-build
      target: inference
      args:
        EXTRA: serving
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Insert-only database role: the API can record predictions and nothing else.
      OPS_DATABASE_URL: postgresql://churn_inference:${INFERENCE_DB_PASSWORD:?}@postgres:5432/churn_ops
      CHURN_MODEL_NAME: ${CHURN_MODEL_NAME:-customer-churn-classifier}
      # Fail fast on registry errors; the service keeps retrying the initial load itself.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "20"
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768m

  # Runs a monitoring cycle every few minutes (only when new predictions or outcomes
  # arrived). It may create retraining requests but never trains or deploys.
  monitoring-worker:
    <<: [*restart-policy, *hardened]
    image: churn-platform/worker:1.0.0
    build:
      <<: *platform-build
      target: worker
      args:
        EXTRA: monitoring
    command: ["churnctl", "monitor", "run", "--loop"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OPS_DATABASE_URL: postgresql://churn_ops:${OPS_DB_PASSWORD:?}@postgres:5432/churn_ops
      CHURN_MODEL_NAME: ${CHURN_MODEL_NAME:-customer-churn-classifier}
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      mlflow:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  prometheus:
    <<: [*restart-policy, *no-new-privileges]
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    <<: [*restart-policy, *no-new-privileges]
    image: grafana/grafana:13.0.9
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Dashboards are viewable without login (read-only Viewer role). Grafana is bound to
      # 127.0.0.1, inside the local trust boundary; changing anything needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inference-operations.json
      # Read by the provisioned PostgreSQL data source (SELECT-only role).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
